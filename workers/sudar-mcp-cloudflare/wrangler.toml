name = "sudar-mcp-cloudflare"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SUDAR_TOOLSET = "all"

# Set via: wrangler secret put <NAME>
# SUPABASE_URL, SUPABASE_ANON_KEY, MCP_TOKEN_SECRET
# SUDAR_STUDIO_URL = https://studio.thesudar.app
# SUDAR_LEARN_URL = https://learn.thesudar.app
# SUDAR_INTELLIGENCE_URL = https://intelligence.thesudar.app
# MCP_PUBLIC_URL = https://mcp.thesudar.app

# Attach custom domain after deploy:
# wrangler custom-domains add mcp.thesudar.app
# Or configure in Cloudflare Dashboard → Workers → Triggers

[observability]
enabled = true
