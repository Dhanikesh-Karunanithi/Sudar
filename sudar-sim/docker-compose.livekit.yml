# Local LiveKit for SudarSim voice development.
# Usage: docker compose -f docker-compose.livekit.yml up -d
services:
  livekit:
    image: livekit/livekit-server:v1.8
    command: --config /etc/livekit.yaml --dev
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped
