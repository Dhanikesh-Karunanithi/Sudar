<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Warp Loading</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  /* ── Speed streaks ── */
  .speed-lines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  .streak { stroke-linecap: round; }

  @keyframes streak-fly {
    0%   { transform: translateX(-110%); opacity: 0; }
    10%  { opacity: 0.6; }
    85%  { opacity: 0.4; }
    100% { transform: translateX(110%); opacity: 0; }
  }

  .s1  { animation: streak-fly 1.1s linear infinite; animation-delay: 0s; }
  .s2  { animation: streak-fly 1.3s linear infinite; animation-delay: -0.28s; }
  .s3  { animation: streak-fly 1.0s linear infinite; animation-delay: -0.62s; }
  .s4  { animation: streak-fly 1.2s linear infinite; animation-delay: -0.12s; }
  .s5  { animation: streak-fly 1.05s linear infinite; animation-delay: -0.75s; }
  .s6  { animation: streak-fly 1.4s linear infinite; animation-delay: -0.45s; }
  .s7  { animation: streak-fly 1.0s linear infinite; animation-delay: -0.9s; }
  .s8  { animation: streak-fly 1.25s linear infinite; animation-delay: -0.2s; }
  .s9  { animation: streak-fly 1.15s linear infinite; animation-delay: -0.68s; }
  .s10 { animation: streak-fly 0.95s linear infinite; animation-delay: -0.38s; }
  .s11 { animation: streak-fly 1.35s linear infinite; animation-delay: -0.82s; }
  .s12 { animation: streak-fly 1.05s linear infinite; animation-delay: -0.18s; }
  .s13 { animation: streak-fly 1.2s  linear infinite; animation-delay: -0.52s; }
  .s14 { animation: streak-fly 1.0s  linear infinite; animation-delay: -0.7s; }
  .s15 { animation: streak-fly 1.3s  linear infinite; animation-delay: -0.32s; }
  .s16 { animation: streak-fly 1.1s  linear infinite; animation-delay: -0.88s; }

  /* ── Logo wrapper — no filter here, no shadow box ── */
  #sudar-logo {
    position: relative;
    z-index: 10;
    width: 360px;
    height: 220px;
  }

  /* Scene only handles the skew lean — no filter, no scale */
  .scene {
    position: relative;
    width: 360px;
    height: 220px;
    transform-origin: center center;
    animation: scene-lean 3.8s ease-in-out infinite;
  }

  /* Very gentle lean — no scaling, no boxy shadow */
  @keyframes scene-lean {
    0%   { transform: skewX(-3deg); }
    50%  { transform: skewX(-6deg); }
    100% { transform: skewX(-3deg); }
  }

  /* ── Pills — blur applied directly here, not on container ── */
  .pill {
    position: absolute;
    border-radius: 999px;
    background: #111111;
    height: 64px;
    overflow: hidden;
  }

  .pill--top {
    width: 170px;
    top: 36px;
    left: 50%;
    z-index: 2;
    transform-origin: center center;
    animation: pill-warp-top 3.8s ease-in-out infinite;
  }

  .pill--bottom {
    width: 170px;
    top: 100px;
    left: 50%;
    z-index: 1;
    transform-origin: center center;
    animation: pill-warp-bottom 3.8s ease-in-out infinite;
    animation-delay: -0.3s;
  }

  /* Pills elongate + direct gaussian blur — always at least slightly blurred */
  @keyframes pill-warp-top {
    0%   {
      transform: translateX(calc(-50% + 20px)) scaleX(1.04) scaleY(0.97);
      filter: blur(1px);
    }
    50%  {
      transform: translateX(calc(-50% + 20px)) scaleX(1.14) scaleY(0.91);
      filter: blur(2.8px);
    }
    100% {
      transform: translateX(calc(-50% + 20px)) scaleX(1.04) scaleY(0.97);
      filter: blur(1px);
    }
  }

  @keyframes pill-warp-bottom {
    0%   {
      transform: translateX(calc(-50% - 20px)) scaleX(1.04) scaleY(0.97);
      filter: blur(1px);
    }
    50%  {
      transform: translateX(calc(-50% - 20px)) scaleX(1.14) scaleY(0.91);
      filter: blur(2.8px);
    }
    100% {
      transform: translateX(calc(-50% - 20px)) scaleX(1.04) scaleY(0.97);
      filter: blur(1px);
    }
  }

  /* ── Ghost afterimage — horizontal SVG blur only on these ── */
  .ghost-wrap {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 9;
    filter: url(#hblur);
    animation: ghost-drift 3.8s ease-in-out infinite;
  }

  @keyframes ghost-drift {
    0%   { transform: translateX(-10px) skewX(-3deg); opacity: 0.06; }
    50%  { transform: translateX(-20px) skewX(-6deg); opacity: 0.11; }
    100% { transform: translateX(-10px) skewX(-3deg); opacity: 0.06; }
  }

  .ghost-pill {
    position: absolute;
    border-radius: 999px;
    background: #111111;
    height: 64px;
  }

  /* ── Side vignette — only left/right fade, no top/bottom ── */
  .side-vignette {
    position: absolute;
    inset: -8px;
    pointer-events: none;
    z-index: 25;
    background: linear-gradient(to right,
      rgba(255,255,255,0.95) 0%,
      rgba(255,255,255,0)    22%,
      rgba(255,255,255,0)    78%,
      rgba(255,255,255,0.95) 100%
    );
    animation: vignette-breathe 3.8s ease-in-out infinite;
  }

  @keyframes vignette-breathe {
    0%   { opacity: 0.6; }
    50%  { opacity: 1;   }
    100% { opacity: 0.6; }
  }

  /* ── Tunnel rings — subtle, slow ── */
  .tunnel-ring {
    position: fixed;
    border-radius: 50%;
    border: 1px solid rgba(180,180,180,0.15);
    pointer-events: none;
    z-index: 0;
    top: 50%;
    left: 50%;
    width: 320px;
    height: 200px;
    transform: translate(-50%, -50%) scale(0);
    animation: ring-expand 3.8s cubic-bezier(0.2, 0, 0.6, 1) infinite;
  }

  .tunnel-ring:nth-child(1) { animation-delay: 0s; }
  .tunnel-ring:nth-child(2) { animation-delay: -0.95s; }
  .tunnel-ring:nth-child(3) { animation-delay: -1.9s; }
  .tunnel-ring:nth-child(4) { animation-delay: -2.85s; }

  @keyframes ring-expand {
    0%   { transform: translate(-50%, -50%) scale(0.3); opacity: 0.5; }
    70%  { transform: translate(-50%, -50%) scale(3);   opacity: 0.1; }
    100% { transform: translate(-50%, -50%) scale(5);   opacity: 0;   }
  }

  /* ── Star — stays sharp as the anchor ── */
  .star {
    position: absolute;
    left: 50%;
    top: 100px;
    width: 90px;
    height: 90px;
    transform: translate(-50%, -50%);
    z-index: 20;
    pointer-events: none;
    animation: star-anchor 3.8s ease-in-out infinite;
  }

  @keyframes star-anchor {
    0%   { transform: translate(-50%, -50%) scale(1);    filter: blur(0px); }
    50%  { transform: translate(-50%, -50%) scale(0.98); filter: blur(0.5px); }
    100% { transform: translate(-50%, -50%) scale(1);    filter: blur(0px); }
  }

  #star-core { width: 100%; height: 100%; }
</style>
</head>
<body>

<!-- SVG blur filters — horizontal only -->
<svg width="0" height="0" style="position:absolute;pointer-events:none;">
  <defs>
    <filter id="hblur" x="-40%" y="0%" width="180%" height="100%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8 0"/>
    </filter>
  </defs>
</svg>

<!-- Tunnel rings -->
<div class="tunnel-ring"></div>
<div class="tunnel-ring"></div>
<div class="tunnel-ring"></div>
<div class="tunnel-ring"></div>

<!-- Speed streaks -->
<svg class="speed-lines" viewBox="0 0 800 600"
     xmlns="http://www.w3.org/2000/svg"
     preserveAspectRatio="xMidYMid slice">
  <line class="streak s1"  x1="0" y1="42"  x2="300" y2="42"  stroke="#d8d8d8" stroke-width="1.5"/>
  <line class="streak s2"  x1="0" y1="90"  x2="180" y2="90"  stroke="#d0d0d0" stroke-width="1"/>
  <line class="streak s3"  x1="0" y1="130" x2="380" y2="130" stroke="#d4d4d4" stroke-width="2"/>
  <line class="streak s4"  x1="0" y1="168" x2="140" y2="168" stroke="#cccccc" stroke-width="1"/>
  <line class="streak s5"  x1="0" y1="210" x2="420" y2="210" stroke="#d8d8d8" stroke-width="2.5"/>
  <line class="streak s6"  x1="0" y1="248" x2="200" y2="248" stroke="#d0d0d0" stroke-width="1"/>
  <line class="streak s7"  x1="0" y1="278" x2="340" y2="278" stroke="#d4d4d4" stroke-width="1.5"/>
  <line class="streak s8"  x1="0" y1="305" x2="160" y2="305" stroke="#c8c8c8" stroke-width="1"/>
  <line class="streak s9"  x1="0" y1="328" x2="390" y2="328" stroke="#d4d4d4" stroke-width="2"/>
  <line class="streak s10" x1="0" y1="358" x2="220" y2="358" stroke="#d0d0d0" stroke-width="1"/>
  <line class="streak s11" x1="0" y1="390" x2="310" y2="390" stroke="#d4d4d4" stroke-width="1.5"/>
  <line class="streak s12" x1="0" y1="425" x2="170" y2="425" stroke="#cccccc" stroke-width="1"/>
  <line class="streak s13" x1="0" y1="460" x2="360" y2="460" stroke="#d4d4d4" stroke-width="2"/>
  <line class="streak s14" x1="0" y1="500" x2="130" y2="500" stroke="#c8c8c8" stroke-width="1"/>
  <line class="streak s15" x1="0" y1="535" x2="280" y2="535" stroke="#d4d4d4" stroke-width="1.5"/>
  <line class="streak s16" x1="0" y1="572" x2="190" y2="572" stroke="#d0d0d0" stroke-width="1"/>
</svg>

<!-- Logo -->
<div id="sudar-logo">
  <div class="scene">

    <!-- Ghost afterimage -->
    <div class="ghost-wrap">
      <div class="ghost-pill" style="width:170px; top:36px;  left:50%; transform:translateX(calc(-50% + 20px));"></div>
      <div class="ghost-pill" style="width:170px; top:100px; left:50%; transform:translateX(calc(-50% - 20px));"></div>
    </div>

    <!-- Pills -->
    <div class="pill pill--top"></div>
    <div class="pill pill--bottom"></div>

    <!-- Side vignette -->
    <div class="side-vignette"></div>

    <!-- Star -->
    <div class="star">
      <svg id="star-core" viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           aria-label="Sparkle star mark" role="img">
        <path
          d="M 50 2 C 51 49, 51 49, 98 50 C 51 51, 51 51, 50 98 C 49 51, 49 51, 2 50 C 49 49, 49 49, 50 2 Z"
          fill="#ffffff"/>
      </svg>
    </div>

  </div>
</div>

</body>
</html>
