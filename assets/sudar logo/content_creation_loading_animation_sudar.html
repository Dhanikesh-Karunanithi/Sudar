<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sudar – Content Creating</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: 340px;
    height: 340px;
  }

  .orbit-ring {
    position: absolute;
    border-radius: 50%;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border: 1px dashed rgba(0,0,0,0.08);
  }
  .orbit-ring--1 { width: 192px; height: 192px; }
  .orbit-ring--2 { width: 296px; height: 296px; }

  .logo-center {
    position: absolute;
    top: 50%; left: 50%;
    width: 137px;
    height: 84px;
    transform: translate(-50%, -50%);
    z-index: 20;
    animation: logo-breathe 9.8s ease-in-out infinite;
  }

  @keyframes logo-breathe {
    0%,100% { transform: translate(-50%,-50%) scale(1); }
    50%      { transform: translate(-50%,-50%) scale(1.05); }
  }

  /* ── Orbits ── */
  .inner-orbit {
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    animation: spin-cw 10s linear infinite;
  }
  .inner-orbit .item {
    position: absolute;
    transform: translate(-50%,-50%);
    animation: unspin-cw 10s linear infinite;
  }
  .inner-orbit .item:nth-child(1) { top: -96px; left: 0; }
  .inner-orbit .item:nth-child(2) { top: 0;     left: 96px; }
  .inner-orbit .item:nth-child(3) { top: 96px;  left: 0; }
  .inner-orbit .item:nth-child(4) { top: 0;     left: -96px; }

  .outer-orbit {
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    animation: spin-ccw 16s linear infinite;
  }
  .outer-orbit .item {
    position: absolute;
    transform: translate(-50%,-50%);
    animation: unspin-ccw 16s linear infinite;
  }
  .outer-orbit .item:nth-child(1) { top: -148px; left: 0; }
  .outer-orbit .item:nth-child(2) { top: 0;      left: 148px; }
  .outer-orbit .item:nth-child(3) { top: 148px;  left: 0; }
  .outer-orbit .item:nth-child(4) { top: 0;      left: -148px; }

  @keyframes spin-cw    { to { transform: rotate(360deg); } }
  @keyframes spin-ccw   { to { transform: rotate(-360deg); } }
  @keyframes unspin-cw  { to { transform: translate(-50%,-50%) rotate(-360deg); } }
  @keyframes unspin-ccw { to { transform: translate(-50%,-50%) rotate(360deg); } }

  /* ── Pill chips ── */
  .chip {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    background: #111111;
    width: 44px;
    height: 24px;
    animation: chip-breathe 3.8s ease-in-out infinite;
  }
  .inner-orbit .item:nth-child(1) .chip { animation-delay: 0s; }
  .inner-orbit .item:nth-child(2) .chip { animation-delay: -0.95s; }
  .inner-orbit .item:nth-child(3) .chip { animation-delay: -1.9s; }
  .inner-orbit .item:nth-child(4) .chip { animation-delay: -2.85s; }
  .outer-orbit .item:nth-child(1) .chip { animation-delay: -0.5s; }
  .outer-orbit .item:nth-child(2) .chip { animation-delay: -1.4s; }
  .outer-orbit .item:nth-child(3) .chip { animation-delay: -2.3s; }
  .outer-orbit .item:nth-child(4) .chip { animation-delay: -3.2s; }

  @keyframes chip-breathe {
    0%,100% { transform: scaleX(1)   scaleY(1); box-shadow: 0 1px 6px rgba(0,0,0,0.15); opacity: 0.75; }
    50%      { transform: scaleX(1.1) scaleY(1); box-shadow: 0 2px 12px rgba(0,0,0,0.25); opacity: 1; }
  }
  .chip svg { display: block; }

  /* ── Text fragments ── */
  .text-fragment {
    position: absolute;
    font-size: 8.5px; font-weight: 500;
    letter-spacing: 0.05em; color: rgba(0,0,0,0.2);
    pointer-events: none; white-space: nowrap;
  }
  .tf1 { top: 8px;     left: 50%;   animation: tfc 4s ease-in-out infinite 0s; }
  .tf2 { top: 34px;    left: 16px;  animation: tf  4s ease-in-out infinite -1s; }
  .tf3 { top: 34px;    right: 16px; animation: tf  4s ease-in-out infinite -2s; }
  .tf4 { bottom: 8px;  left: 50%;   animation: tfc 4s ease-in-out infinite -1.5s; }
  .tf5 { bottom: 34px; left: 12px;  animation: tf  4s ease-in-out infinite -0.5s; }
  .tf6 { bottom: 34px; right: 12px; animation: tf  4s ease-in-out infinite -2.5s; }

  @keyframes tf  { 0%,100%{opacity:.35;transform:translateY(0);}           50%{opacity:.8;transform:translateY(-3px);} }
  @keyframes tfc { 0%,100%{opacity:.35;transform:translateX(-50%) translateY(0);} 50%{opacity:.8;transform:translateX(-50%) translateY(-3px);} }

  .cursor {
    display: inline-block; width: 1.5px; height: 8px;
    background: rgba(0,0,0,0.3); margin-left: 1px;
    vertical-align: middle; animation: blink 1s step-end infinite;
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }

  /* ── Progress bar ── */
  .progress-wrap {
    margin-top: 28px; width: 200px; height: 2px;
    background: #ececec; border-radius: 99px; overflow: hidden;
  }
  .progress-bar {
    height: 100%; border-radius: 99px; background: #111111;
    animation: bar-warp 2.8s ease-in-out infinite;
  }
  @keyframes bar-warp {
    0%   { width:8%;  margin-left:0%; }
    50%  { width:55%; margin-left:20%; }
    100% { width:8%;  margin-left:92%; }
  }

  .label {
    margin-top: 12px; font-size: 11px; font-weight: 500;
    color: rgba(0,0,0,0.3); letter-spacing: 0.08em; text-transform: uppercase;
    animation: label-pulse 3.8s ease-in-out infinite;
  }
  @keyframes label-pulse { 0%,100%{opacity:.2;} 50%{opacity:1;} }
</style>
</head>
<body>

<!--
  Single live filter — stdDeviation and opacity driven by JS rAF loop.
  This is the only reliable way to get smooth glow transitions;
  switching between url(#filter-a) → url(#filter-b) always jumps in CSS.
-->
<svg width="0" height="0" style="position:absolute;pointer-events:none;">
  <defs>
    <filter id="star-glow" x="-120%" y="-120%" width="340%" height="340%">
      <!-- Layer 1: tight halo -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="0" result="blur-tight" id="blur-tight"/>
      <!-- Layer 2: mid bloom -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="0" result="blur-mid"   id="blur-mid"/>
      <!-- Layer 3: wide atmospheric -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="0" result="blur-wide"  id="blur-wide"/>
      <feMerge>
        <feMergeNode in="blur-wide"/>
        <feMergeNode in="blur-mid"/>
        <feMergeNode in="blur-tight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>

<div class="stage">

  <div class="orbit-ring orbit-ring--1"></div>
  <div class="orbit-ring orbit-ring--2"></div>

  <div class="text-fragment tf1">H1 Headline<span class="cursor"></span></div>
  <div class="text-fragment tf2">— Objective</div>
  <div class="text-fragment tf3">Body copy…</div>
  <div class="text-fragment tf4">■ Key message<span class="cursor"></span></div>
  <div class="text-fragment tf5">▸ Slide 01</div>
  <div class="text-fragment tf6">✦ Layout</div>

  <!-- Inner orbit -->
  <div class="inner-orbit">
    <div class="item"><div class="chip">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><circle cx="11" cy="11" r="2"/>
      </svg>
    </div></div>
    <div class="item"><div class="chip">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1"/><circle cx="17.5" cy="6.5" r="3.5"/><path d="M3 21l4.5-7 3.5 5 2.5-3.5L17 21H3z"/>
      </svg>
    </div></div>
    <div class="item"><div class="chip">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><circle cx="8" cy="10" r="1.2" fill="#fff" stroke="none"/><circle cx="12" cy="7" r="1.2" fill="#fff" stroke="none"/><circle cx="16" cy="10" r="1.2" fill="#fff" stroke="none"/><circle cx="17" cy="15" r="2" fill="#fff" stroke="none"/>
      </svg>
    </div></div>
    <div class="item"><div class="chip">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
    </div></div>
  </div>

  <!-- Outer orbit -->
  <div class="outer-orbit">
    <div class="item"><div class="chip">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/>
      </svg>
    </div></div>
    <div class="item"><div class="chip">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="13" rx="2"/><line x1="5" y1="8" x2="19" y2="8"/><line x1="5" y1="11" x2="13" y2="11"/><line x1="5" y1="14" x2="10" y2="14"/><line x1="12" y1="21" x2="12" y2="17"/>
      </svg>
    </div></div>
    <div class="item"><div class="chip">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4.5" cy="6" r="1.5" fill="#fff" stroke="none"/><circle cx="4.5" cy="12" r="1.5" fill="#fff" stroke="none"/><circle cx="4.5" cy="18" r="1.5" fill="#fff" stroke="none"/>
      </svg>
    </div></div>
    <div class="item"><div class="chip">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 22 8.5 12 15 2 8.5 12 2"/><polyline points="2 13.5 12 20 22 13.5"/>
      </svg>
    </div></div>
  </div>

  <!-- Sudar Logo -->
  <div class="logo-center">
    <svg viewBox="0 0 210 128" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="0"  y="64" width="170" height="64" rx="32" fill="#111111"/>
      <rect x="40" y="0"  width="170" height="64" rx="32" fill="#111111"/>
      <g id="star-group" style="filter:url(#star-glow)">
        <path
          id="star-path"
          transform="translate(60, 19) scale(0.9)"
          d="M 50 2 C 51 49, 51 49, 98 50 C 51 51, 51 51, 50 98 C 49 51, 49 51, 2 50 C 49 49, 49 49, 50 2 Z"
          fill="#ffffff"/>
      </g>
    </svg>
  </div>

</div>

<div class="progress-wrap">
  <div class="progress-bar"></div>
</div>
<div class="label">Crafting your content<span class="cursor"></span></div>

<script>
  // Grab the three feGaussianBlur nodes inside our single filter
  const blurTight = document.getElementById('blur-tight');
  const blurMid   = document.getElementById('blur-mid');
  const blurWide  = document.getElementById('blur-wide');
  const starPath  = document.getElementById('star-path');

  // Glow cycle: 9.8s to match logo-breathe
  const CYCLE    = 9800;   // ms — matches logo-breathe duration
  const MIN_OP   = 0.75;   // opacity at rest
  const MAX_OP   = 1.0;    // opacity at peak glow

  function easeInOut(t) {
    // Smooth sine wave: goes 0 → 1 → 0 over t = 0..1
    return (1 - Math.cos(Math.PI * 2 * t)) / 2;
  }

  function tick(timestamp) {
    // Normalised position in cycle: 0 → 1
    const t = (timestamp % CYCLE) / CYCLE;

    // eased value: 0 at start/end, peaks at t=0.5
    const e = easeInOut(t);

    // Smoothly interpolate blur radii
    // tight:  0  → 2.5
    // mid:    0  → 8
    // wide:   0  → 18
    const tight = e * 2.5;
    const mid   = e * 8;
    const wide  = e * 18;

    blurTight.setAttribute('stdDeviation', tight.toFixed(3));
    blurMid  .setAttribute('stdDeviation', mid.toFixed(3));
    blurWide .setAttribute('stdDeviation', wide.toFixed(3));

    // Also smoothly fade opacity in sync
    const opacity = MIN_OP + (MAX_OP - MIN_OP) * e;
    starPath.setAttribute('opacity', opacity.toFixed(3));

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
</script>

</body>
</html>
