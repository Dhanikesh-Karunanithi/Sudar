# Staging learn/studio: Cloudflare Worker proxy → Vercel (auto DNS via custom domains).
name: Ops — staging access (Cloudflare → Vercel)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/sudar-staging-vercel/**"
      - ".github/workflows/ops-staging-dns.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy sudar-staging-vercel proxy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and deploy
        working-directory: workers/sudar-staging-vercel
        run: |
          npm install
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
