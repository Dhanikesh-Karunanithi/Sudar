# Point staging.learn / staging.studio at Vercel (A → 76.76.21.21, DNS only).
name: Ops — staging DNS (Cloudflare → Vercel)

on:
  workflow_dispatch:

jobs:
  dns:
    runs-on: ubuntu-latest
    name: Upsert staging A records on thesudar.com
    steps:
      - uses: actions/checkout@v4

      - name: Cloudflare DNS — staging.learn + staging.studio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/ops/cloudflare-dns-staging-vercel.mjs
