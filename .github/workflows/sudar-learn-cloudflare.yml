# Deploy Sudar Learn to Cloudflare Workers (OpenNext) on push to main.
name: Deploy sudar-learn (Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - "sudar-learn/**"
      - "shared/**"
      - "supabase/migrations/**"
      - "scripts/sync-help-center-ai.mjs"
      - "help-center/**"
      - ".github/workflows/sudar-learn-cloudflare.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Cloudflare Workers — sudar-learn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sudar-learn/package-lock.json

      - name: Install
        working-directory: sudar-learn
        run: npm ci

      # NEXT_PUBLIC_* must be present at OpenNext/Next build time (inlined into client JS).
      # Worker runtime secrets alone are not enough — see docs/CLOUDFLARE_PAGES_DEPLOY.md.
      - name: Build and deploy (OpenNext)
        working-directory: sudar-learn
        run: npm run deploy:cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://learn.thesudar.com
          NEXTAUTH_URL: https://learn.thesudar.com
          EARLY_ACCESS_ENABLED: "true"
