name: Security checks

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [sudar-learn, sudar-studio]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: npm ci
        run: npm ci
      # Tighten to --audit-level=moderate once the backlog is cleared.
      - name: npm audit (production deps)
        run: npm audit --omit=dev --audit-level=critical

  pip-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sudar-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt
        continue-on-error: true

  rls-sanity-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List RLS migrations check (documentary)
        run: |
          echo "Apply supabase migrations locally and run: scripts/sql/rls_audit.sql"
          test -f scripts/sql/rls_audit.sql
