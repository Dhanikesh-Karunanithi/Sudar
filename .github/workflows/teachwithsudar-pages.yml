# Deploy thesudar.com (gateway) and teachwithsudar.com (marketing) as separate Cloudflare Pages projects.
name: Deploy teachwithsudar

on:
  push:
    branches: [main]
    paths:
      - "teachwithsudar/**"
      - "help-center/**"
      - "scripts/copy-launch-demo.mjs"
      - ".github/workflows/teachwithsudar-pages.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: gateway
            project: thesudar
            label: thesudar.com gateway
          - variant: marketing
            project: teachwithsudar
            label: teachwithsudar.com marketing
    name: Cloudflare Pages (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: teachwithsudar/package-lock.json

      - name: Install marketing site
        working-directory: teachwithsudar
        run: npm ci

      - name: Install launch demo
        working-directory: sudar-ecosystem-demo
        run: npm ci

      - name: Build static export
        working-directory: teachwithsudar
        env:
          NEXT_PUBLIC_SITE_VARIANT: ${{ matrix.variant }}
          NEXT_PUBLIC_STUDIO_APP_URL: https://studio.thesudar.com
          NEXT_PUBLIC_LEARN_APP_URL: https://learn.thesudar.com
          NEXT_PUBLIC_ECOSYSTEM_DEMO_URL: https://demo.thesudar.com
        run: npm run build

      - name: Ensure Cloudflare Pages project exists
        working-directory: teachwithsudar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages project create ${{ matrix.project }} --production-branch main || true

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: teachwithsudar
          command: pages deploy out --project-name=${{ matrix.project }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Print deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: echo "Deployed ${{ matrix.label }} to ${DEPLOYMENT_URL}"
