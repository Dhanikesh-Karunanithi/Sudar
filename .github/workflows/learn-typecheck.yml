name: Learn TypeScript (informational)

on:
  pull_request:
    paths:
      - 'sudar-learn/**'
  push:
    branches: [main, master]
    paths:
      - 'sudar-learn/**'

jobs:
  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sudar-learn/package-lock.json
      - run: npm ci
        working-directory: sudar-learn
      - name: Typecheck (non-blocking until debt cleared)
        run: npx tsc --noEmit
        working-directory: sudar-learn
        continue-on-error: true
