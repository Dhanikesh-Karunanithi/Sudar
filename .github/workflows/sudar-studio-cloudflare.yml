# Deploy Sudar Studio to Cloudflare Workers (OpenNext) on push to main.
name: Deploy sudar-studio (Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - "sudar-studio/**"
      - "shared/**"
      - "supabase/migrations/**"
      - "scripts/sync-help-center-ai.mjs"
      - "help-center/**"
      - ".github/workflows/sudar-studio-cloudflare.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Verify (lint + tests) — sudar-studio
    defaults:
      run:
        working-directory: sudar-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sudar-studio/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    name: Cloudflare Workers — sudar-studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sudar-studio/package-lock.json

      - name: Install
        working-directory: sudar-studio
        run: npm ci

      - name: Build and deploy (OpenNext)
        working-directory: sudar-studio
        run: npm run deploy:cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_LEARN_APP_URL: https://learn.thesudar.com
          NEXT_PUBLIC_MCP_URL: https://mcp.thesudar.com
          NEXTAUTH_URL: https://studio.thesudar.com
          NEXT_PUBLIC_LIVEKIT_URL: ${{ vars.NEXT_PUBLIC_LIVEKIT_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          EARLY_ACCESS_ENABLED: "true"
          ADMIN_EMAILS: dhanikesh.karunanithi@foundever.com,connect@dhanikeshkarunanithi.com
